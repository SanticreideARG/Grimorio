<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Valle Quemado — Cap. I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cinzel+Decorative:wght@700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1608;
    --ink-soft:#43260f;
    --amber:#c9913f;
    --amber-lt:#e8c483;
    --sepia:#7c4a1e;
    --crimson:#7e1d16;
    --crimson-glow:#b23522;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#0a0705;
    background:
      radial-gradient(120% 120% at 50% 50%, #181009 0%, #0a0705 70%, #050302 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-family:'Cinzel',serif;
  }
  /* ---- scaling stage ---- */
  #stage{ position:relative; }
  #map{
    position:relative;
    width:1920px; height:1080px;
    transform-origin:center center;
    overflow:hidden;
  }

  /* ===== PARCHMENT BASE ===== */
  .layer{ position:absolute; inset:0; }
  #parchment{
    background:
      radial-gradient(140% 120% at 38% 30%, #e7c896 0%, #d9b577 26%, #c79c56 50%, #a8773a 72%, #7c4f24 100%);
  }
  /* warm mottling blotches */
  #mottle{
    background:
      radial-gradient(closest-side at 22% 64%, rgba(120,70,28,.40), transparent 70%),
      radial-gradient(closest-side at 70% 22%, rgba(150,95,40,.34), transparent 72%),
      radial-gradient(closest-side at 84% 74%, rgba(95,55,22,.42), transparent 70%),
      radial-gradient(closest-side at 46% 88%, rgba(110,62,24,.36), transparent 72%),
      radial-gradient(closest-side at 12% 18%, rgba(170,120,60,.30), transparent 70%),
      radial-gradient(closest-side at 58% 52%, rgba(225,190,135,.30), transparent 60%);
    mix-blend-mode:multiply;
  }
  /* soot / smoke wash drifting across the burned valley */
  #soot{
    background:
      radial-gradient(60% 90% at 30% 110%, rgba(20,12,6,.55), transparent 60%),
      radial-gradient(50% 80% at 78% 115%, rgba(20,12,6,.5), transparent 60%),
      radial-gradient(70% 60% at 50% -10%, rgba(40,22,10,.4), transparent 65%);
    mix-blend-mode:multiply;
  }
  #grain{ opacity:.42; mix-blend-mode:multiply; }
  #fibers{ opacity:.2; mix-blend-mode:multiply; }

  /* ink stains */
  #stains{ pointer-events:none; }

  /* charred ragged border + vignette */
  #vignette{
    background:
      radial-gradient(120% 120% at 50% 50%, transparent 52%, rgba(40,22,8,.5) 78%, rgba(15,8,3,.92) 100%);
    pointer-events:none;
  }
  #burn{ pointer-events:none; }

  /* ===== PATH + NODES ===== */
  #routes, #scenery, #frame-art{ pointer-events:none; }
  .node{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    width:84px; height:84px;
  }
  .medallion{
    position:relative; width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 38% 32%, #f1d59a 0%, #cf9d4f 42%, #a9762f 78%, #835414 100%);
    box-shadow:
      0 0 0 2px rgba(60,33,12,.9),
      0 0 0 6px rgba(214,170,95,.55),
      0 0 0 8px rgba(48,26,9,.85),
      0 10px 22px rgba(20,10,3,.55),
      inset 0 2px 5px rgba(255,238,200,.55),
      inset 0 -8px 16px rgba(70,40,14,.6);
  }
  .medallion::after{
    content:""; position:absolute; inset:9px; border-radius:50%;
    border:1.5px solid rgba(70,40,14,.55);
    box-shadow:inset 0 0 12px rgba(80,45,16,.5);
  }
  .icon{ font-size:38px; line-height:1; filter:drop-shadow(0 1px 1px rgba(255,240,210,.5)) saturate(.85) contrast(1.05); z-index:2; }
  .num{
    position:absolute; top:-12px; left:-12px; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel',serif; font-weight:700; font-size:17px; color:#f3dcab;
    background:radial-gradient(circle at 38% 32%, #5a3214, #2c1606);
    box-shadow:0 0 0 2px rgba(214,170,95,.7), 0 3px 7px rgba(0,0,0,.5);
    z-index:3; text-shadow:0 1px 1px #000;
  }
  /* type tints */
  .t-elite .medallion{ box-shadow:0 0 0 2px rgba(60,20,12,.9),0 0 0 6px rgba(150,52,40,.55),0 0 0 8px rgba(44,14,9,.9),0 10px 22px rgba(20,6,3,.6),inset 0 2px 5px rgba(255,225,200,.5),inset 0 -8px 16px rgba(90,28,18,.6); }
  .t-shop .medallion::after{ border-color:rgba(120,82,20,.7); }

  /* BOSS */
  .node.boss{ width:140px; height:140px; }
  .boss .medallion{
    background:
      radial-gradient(circle at 40% 32%, #e9b27e 0%, #c0612f 38%, #8a2a18 72%, #4d130c 100%);
    box-shadow:
      0 0 0 3px rgba(40,12,6,.95),
      0 0 0 8px rgba(178,53,34,.55),
      0 0 0 11px rgba(34,10,5,.9),
      0 0 40px 8px rgba(150,30,18,.55),
      0 14px 30px rgba(15,5,2,.7),
      inset 0 3px 8px rgba(255,210,170,.45),
      inset 0 -12px 24px rgba(70,16,10,.7);
    animation:bosspulse 3.6s ease-in-out infinite;
  }
  .boss .icon{ font-size:62px; }
  .boss .num{ top:-8px; left:-8px; width:42px; height:42px; font-size:21px; }
  @keyframes bosspulse{
    0%,100%{ box-shadow:0 0 0 3px rgba(40,12,6,.95),0 0 0 8px rgba(178,53,34,.55),0 0 0 11px rgba(34,10,5,.9),0 0 34px 6px rgba(150,30,18,.45),0 14px 30px rgba(15,5,2,.7),inset 0 3px 8px rgba(255,210,170,.45),inset 0 -12px 24px rgba(70,16,10,.7); }
    50%{ box-shadow:0 0 0 3px rgba(40,12,6,.95),0 0 0 8px rgba(178,53,34,.6),0 0 0 11px rgba(34,10,5,.9),0 0 56px 14px rgba(178,42,24,.7),0 14px 30px rgba(15,5,2,.7),inset 0 3px 8px rgba(255,210,170,.45),inset 0 -12px 24px rgba(70,16,10,.7); }
  }
  @media (prefers-reduced-motion: reduce){ .boss .medallion{ animation:none; } }

  /* ===== TITLE CARTOUCHE ===== */
  #cartouche{
    position:absolute; top:40px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:6; pointer-events:none;
    padding:14px 54px;
  }
  #cartouche .rule{
    width:340px; height:14px; margin:0 auto;
    background:
      radial-gradient(circle at 50% 50%, var(--ink) 0 2px, transparent 3px) center/14px 14px,
      linear-gradient(90deg, transparent, var(--ink-soft) 18%, var(--ink-soft) 82%, transparent);
    opacity:.0;
  }
  #cartouche .sub{
    font-family:'Cinzel',serif; font-weight:600; letter-spacing:.46em;
    font-size:19px; color:#5b3414; text-indent:.46em; margin-bottom:6px;
    text-shadow:0 1px 0 rgba(255,235,195,.4);
  }
  #cartouche .ttl{
    font-family:'Cinzel Decorative',serif; font-weight:900;
    font-size:58px; letter-spacing:.06em; line-height:1;
    color:#4a1410;
    text-shadow:0 1px 0 rgba(255,230,190,.45), 0 2px 6px rgba(60,20,10,.35);
  }
  #cartouche .orn{
    display:flex; align-items:center; justify-content:center; gap:16px;
    margin-top:10px; color:#6e3f1a; font-size:22px; letter-spacing:.3em;
  }
  #cartouche .orn .ln{ width:120px; height:2px; background:linear-gradient(90deg,transparent,#6e3f1a); }
  #cartouche .orn .ln.r{ background:linear-gradient(90deg,#6e3f1a,transparent); }

  .credit{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    font-family:'IM Fell English',serif; font-style:italic; font-size:17px;
    letter-spacing:.18em; color:#5b3414; opacity:.62; z-index:5;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="map" data-screen-label="Mapa Cap.1 El Valle Quemado">

      <!-- base parchment -->
      <div class="layer" id="parchment"></div>
      <div class="layer" id="mottle"></div>
      <div class="layer" id="soot"></div>

      <!-- scenery + routes (filled by JS) -->
      <svg class="layer" id="scenery" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
      <svg class="layer" id="routes" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>

      <!-- nodes (filled by JS) -->
      <div class="layer" id="nodes"></div>

      <!-- title -->
      <div id="cartouche">
        <div class="sub">CAPÍTULO&nbsp;I</div>
        <div class="ttl">El&nbsp;Valle&nbsp;Quemado</div>
        <div class="orn"><span class="ln"></span>✦<span class="ln r"></span></div>
      </div>

      <!-- compass + frame art (filled by JS) -->
      <svg class="layer" id="frame-art" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>

      <!-- texture + scorch overlays on top -->
      <svg class="layer" id="stains" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
      <svg class="layer" id="grain"></svg>
      <svg class="layer" id="fibers"></svg>
      <div class="layer" id="vignette"></div>
      <svg class="layer" id="burn" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>

    </div>
  </div>

<script>
/* ======================= NODE DATA ======================= */
const NODES = [
  {n:1,  x:250,  y:300, t:'combat'},
  {n:2,  x:700,  y:256, t:'combat'},
  {n:3,  x:1168, y:330, t:'event'},
  {n:4,  x:1662, y:280, t:'combat'},
  {n:5,  x:1680, y:520, t:'shop'},
  {n:6,  x:1208, y:560, t:'rest'},
  {n:7,  x:742,  y:500, t:'combat'},
  {n:8,  x:272,  y:566, t:'elite'},
  {n:9,  x:262,  y:760, t:'event'},
  {n:10, x:720,  y:732, t:'combat'},
  {n:11, x:1192, y:782, t:'rest'},
  {n:12, x:1660, y:734, t:'elite'},
  {n:13, x:1676, y:950, t:'shop'},
  {n:14, x:1200, y:968, t:'event'},
  {n:15, x:720,  y:946, t:'rest'},
  {n:16, x:250,  y:958, t:'boss'},
];
const ICON = { combat:'⚔️', elite:'☠️', event:'🃏', rest:'🛏️', shop:'🪙', boss:'👑' };

/* ======================= SMOOTH PATH (Catmull-Rom -> Bezier) ======================= */
function smoothPath(pts){
  if(pts.length<2) return '';
  const p=pts.map(o=>({x:o.x,y:o.y}));
  let d=`M ${p[0].x} ${p[0].y}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p[i+1];
    const k=0.16;
    const c1x=p1.x+(p2.x-p0.x)*k, c1y=p1.y+(p2.y-p0.y)*k;
    const c2x=p2.x-(p3.x-p1.x)*k, c2y=p2.y-(p3.y-p1.y)*k;
    d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
  }
  return d;
}

/* ======================= ROUTES ======================= */
(function(){
  const svg=document.getElementById('routes');
  const d=smoothPath(NODES);
  const NS='http://www.w3.org/2000/svg';
  function mk(stroke,w,dash,op,blur){
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('fill','none');
    p.setAttribute('stroke',stroke); p.setAttribute('stroke-width',w);
    p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
    if(dash) p.setAttribute('stroke-dasharray',dash);
    p.setAttribute('opacity',op);
    if(blur) p.setAttribute('filter','url(#roadblur)');
    return p;
  }
  svg.innerHTML=`<defs>
    <filter id="roadblur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>`;
  // worn road bed (wide, soft, blurred)
  svg.appendChild(mk('#6b3f18',26,null,0.34,true));
  svg.appendChild(mk('#a87838',16,null,0.42,true));
  // dotted travel route
  svg.appendChild(mk('#3a1f0c',6,'1 22',0.85,false));
})();

/* ======================= NODES ======================= */
(function(){
  const wrap=document.getElementById('nodes');
  NODES.forEach(o=>{
    const el=document.createElement('div');
    el.className='node t-'+o.t+(o.t==='boss'?' boss':'');
    el.style.left=o.x+'px'; el.style.top=o.y+'px';
    el.innerHTML=`<div class="medallion"><span class="icon">${ICON[o.t]}</span></div><span class="num">${o.n}</span>`;
    wrap.appendChild(el);
  });
})();

/* ======================= SCENERY (cartographic silhouettes) ======================= */
(function(){
  const NS='http://www.w3.org/2000/svg';
  const svg=document.getElementById('scenery');
  const ink='#4a2a10';
  function el(name,attrs){ const e=document.createElementNS(NS,name); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
  function add(node){ svg.appendChild(node); }

  // ---- builders return a <g> ----
  function group(x,y,s,rot,op){
    const g=el('g',{transform:`translate(${x} ${y}) scale(${s}) rotate(${rot||0})`,opacity:op||0.9});
    return g;
  }
  function mountains(x,y,s,op){
    const g=group(x,y,s,0,op);
    g.appendChild(el('path',{d:'M-46 0 L-14 -42 L4 -18 L20 -54 L52 0 Z',fill:ink,opacity:.92}));
    g.appendChild(el('path',{d:'M-14 -42 L-6 -30 L0 -38 L8 -22',stroke:'#caa05c',fill:'none','stroke-width':1.4,opacity:.5}));
    g.appendChild(el('path',{d:'M20 -54 L26 -40 L32 -47',stroke:'#caa05c',fill:'none','stroke-width':1.4,opacity:.5}));
    return g;
  }
  function deadTree(x,y,s,op){
    const g=group(x,y,s,0,op);
    g.appendChild(el('path',{d:'M0 0 L0 -40 M0 -28 L-12 -40 M0 -22 L11 -34 M0 -34 L-8 -46 M0 -36 L9 -47 M0 -16 L-9 -24',stroke:ink,fill:'none','stroke-width':2.4,'stroke-linecap':'round'}));
    return g;
  }
  function ruin(x,y,s,op){
    const g=group(x,y,s,0,op);
    // broken wall + arch
    g.appendChild(el('path',{d:'M-30 0 L-30 -28 L-18 -28 L-18 -14 L-6 -14 L-6 -34 L8 -34 L8 -20 L22 -20 L22 -32 L30 -24 L30 0 Z',fill:ink,opacity:.9}));
    g.appendChild(el('path',{d:'M-2 0 L-2 -22 A8 8 0 0 1 14 -22 L14 0',fill:'none',stroke:'#d8b577','stroke-width':1.2,opacity:.4}));
    return g;
  }
  function burnedVillage(x,y,s,op){
    const g=group(x,y,s,0,op);
    // little houses with roofs, one with flame
    g.appendChild(el('path',{d:'M-40 0 L-40 -16 L-30 -24 L-20 -16 L-20 0 Z',fill:ink}));
    g.appendChild(el('path',{d:'M-14 0 L-14 -20 L-2 -30 L10 -20 L10 0 Z',fill:ink}));
    g.appendChild(el('path',{d:'M16 0 L16 -14 L24 -21 L32 -14 L32 0 Z',fill:ink}));
    // flame over the middle house
    g.appendChild(el('path',{d:'M-2 -30 C-10 -42 4 -44 0 -56 C12 -50 12 -34 2 -30 Z',fill:'#8a2a18',opacity:.85}));
    g.appendChild(el('path',{d:'M-1 -34 C-6 -42 3 -44 0 -52 C7 -47 7 -37 1 -34 Z',fill:'#c0612f',opacity:.9}));
    // smoke
    g.appendChild(el('path',{d:'M0 -56 C-8 -64 6 -70 -2 -82 C8 -76 4 -64 6 -58',stroke:'#3a2410',fill:'none','stroke-width':2,opacity:.4}));
    return g;
  }
  function crow(x,y,s,op){
    const g=group(x,y,s,0,op);
    g.appendChild(el('path',{d:'M-12 0 Q-6 -8 0 0 Q6 -8 12 0',stroke:ink,fill:'none','stroke-width':2.2,'stroke-linecap':'round'}));
    return g;
  }
  function reeds(x,y,s,op){
    const g=group(x,y,s,0,op);
    g.appendChild(el('path',{d:'M0 0 C-3 -16 -3 -22 -6 -30 M5 0 C5 -14 6 -20 4 -26 M-5 0 C-6 -12 -5 -18 -9 -24',stroke:ink,fill:'none','stroke-width':1.8,'stroke-linecap':'round'}));
    return g;
  }

  // Place scenery in gaps (avoiding node centers).
  add(mountains(120,150,1.5,.82));
  add(mountains(430,170,1.15,.62));
  add(mountains(990,150,1.45,.8));
  add(mountains(1480,150,1.2,.7));
  add(mountains(1820,420,1.25,.7));

  add(burnedVillage(470,400,1.25,.92));
  add(burnedVillage(1430,470,1.05,.85));
  add(burnedVillage(960,620,1.4,.95));
  add(burnedVillage(1030,300,0.9,.7));
  add(burnedVillage(470,860,1.0,.8));

  add(ruin(95,560,1.4,.85));
  add(ruin(1850,800,1.3,.82));
  add(ruin(960,920,1.1,.8));
  add(ruin(1430,1000,1.0,.7));

  add(deadTree(330,430,1.5,.9));
  add(deadTree(380,470,1.1,.7));
  add(deadTree(1320,330,1.3,.85));
  add(deadTree(1010,500,1.2,.75));
  add(deadTree(520,690,1.4,.9));
  add(deadTree(1490,640,1.2,.8));
  add(deadTree(120,860,1.4,.85));
  add(deadTree(1880,560,1.2,.7));
  add(deadTree(900,860,1.0,.7));

  add(reeds(640,650,1.6,.7));
  add(reeds(1700,360,1.4,.6));
  add(reeds(380,980,1.5,.65));

  // crows scattered in the skies of the valley
  const crows=[[600,120,1.2],[660,150,0.9],[1180,120,1.1],[1240,150,0.85],[820,360,1.0],[1560,300,1.0],[300,640,1.0],[1750,690,1.1],[860,1010,0.9],[1340,840,1.0],[150,420,0.9]];
  crows.forEach(c=>add(crow(c[0],c[1],c[2],.7)));
})();

/* ======================= COMPASS ROSE + INK STAINS + GRAIN + BURN ======================= */
(function(){
  /* ---- compass rose (bottom-right corner) ---- */
  const fa=document.getElementById('frame-art');
  const cx=1828, cy=974, R=62;
  function ptsStar(r1,r2){
    let p='';
    for(let i=0;i<8;i++){
      const a=(i*45-90)*Math.PI/180, a2=a+22.5*Math.PI/180;
      p+=(i?'L':'M')+(cx+Math.cos(a)*r1)+' '+(cy+Math.sin(a)*r1)+' ';
      p+='L'+(cx+Math.cos(a2)*r2)+' '+(cy+Math.sin(a2)*r2)+' ';
    }
    return p+'Z';
  }
  const NS='http://www.w3.org/2000/svg';
  const letters=['N','E','S','O'];
  let lbl='';
  letters.forEach((L,i)=>{
    const a=(i*90-90)*Math.PI/180, rr=R+24;
    lbl+=`<text x="${cx+Math.cos(a)*rr}" y="${cy+Math.sin(a)*rr+8}" text-anchor="middle" font-family="Cinzel,serif" font-weight="700" font-size="24" fill="#4a2a10" opacity=".8">${L}</text>`;
  });
  fa.innerHTML=`
    <g opacity="0.86">
      <circle cx="${cx}" cy="${cy}" r="${R+12}" fill="none" stroke="#4a2a10" stroke-width="2" opacity=".55"/>
      <circle cx="${cx}" cy="${cy}" r="${R+6}" fill="none" stroke="#4a2a10" stroke-width="1" opacity=".4"/>
      <path d="${ptsStar(R,34)}" fill="#4a2a10" opacity=".22"/>
      <path d="M${cx} ${cy-R} L${cx+18} ${cy} L${cx} ${cy+R} L${cx-18} ${cy} Z" fill="#7e1d16" opacity=".8"/>
      <path d="M${cx-R} ${cy} L${cx} ${cy-18} L${cx+R} ${cy} L${cx} ${cy+18} Z" fill="#3a1f0c" opacity=".85"/>
      <circle cx="${cx}" cy="${cy}" r="7" fill="#3a1f0c"/>
      <circle cx="${cx}" cy="${cy}" r="3" fill="#e8c483"/>
      ${lbl}
    </g>`;

  /* ---- ink stains (turbulent blobs) ---- */
  const st=document.getElementById('stains');
  st.innerHTML=`
    <defs>
      <filter id="blob1"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="60"/>
        <feGaussianBlur stdDeviation="1.4"/></filter>
      <filter id="blob2"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.018" numOctaves="3" seed="22" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="40"/></filter>
    </defs>
    <g fill="#231307">
      <ellipse cx="1560" cy="200" rx="46" ry="30" opacity=".30" filter="url(#blob1)"/>
      <ellipse cx="150" cy="720" rx="40" ry="52" opacity=".26" filter="url(#blob2)"/>
      <ellipse cx="1280" cy="900" rx="34" ry="26" opacity=".24" filter="url(#blob1)"/>
      <ellipse cx="560" cy="240" rx="22" ry="18" opacity=".22" filter="url(#blob2)"/>
      <circle cx="1610" cy="640" r="9" opacity=".4" filter="url(#blob2)"/>
      <circle cx="430" cy="560" r="6" opacity=".4" filter="url(#blob2)"/>
      <circle cx="1120" cy="180" r="7" opacity=".38" filter="url(#blob2)"/>
    </g>`;

  /* ---- paper grain + fibers ---- */
  document.getElementById('grain').setAttribute('viewBox','0 0 1920 1080');
  document.getElementById('grain').innerHTML=`
    <defs><filter id="gr" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>

/* ======================= FIT TO VIEWPORT ======================= */
(function(){
  const map=document.getElementById('map');
  function fit(){
    const w=window.innerWidth||document.documentElement.clientWidth;
    const h=window.innerHeight||document.documentElement.clientHeight;
    if(!w||!h){ requestAnimationFrame(fit); return; }
    const s=Math.min(w/1920, h/1080);
    map.style.transform='scale('+s+')';
  }
  fit();
  window.addEventListener('resize',fit);
  window.addEventListener('load',fit);
})();
</script>
