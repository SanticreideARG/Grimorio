# Deploy de la versión WEB de Grimorio (Vite).
# Esta rama (main) NO incluye Electron; las builds de escritorio
# (instalable / portable) viven en la rama `Electron`.

[build]
  command = "npm run build"   # vite build → genera dist/ (base '/', para dominio raíz)
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: el juego maneja todo por estado de vista (sin router); servimos
# index.html ante cualquier ruta para no devolver 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
